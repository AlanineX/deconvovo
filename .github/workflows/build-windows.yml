name: Build verified Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/waters-desktop.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WatersConsole-win64
          path: release-artifact
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifact/WatersConsole-win64.zip
          body_path: RELEASE_NOTES_v0.3.0.md
