name: Waters desktop candidate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['waters-console-*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DECONVOVO_GUI: '1'
      WINEDEBUG: '-all'
    steps:
      - name: Preserve original source and acquisition bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: portable_waters_convert/build/requirements.txt
      - name: Install Linux native display and Waters reader dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb xauth libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libdbus-1-3
          echo "WINEARCH=win64" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$RUNNER_TEMP/waters-wine" >> "$GITHUB_ENV"
      - name: Install pinned build dependencies
        run: python -m pip install -r portable_waters_convert/build/requirements.txt
      - name: Exercise source application with complete real acquisitions on Windows
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          python portable_waters_convert/build/launcher.py --smoke-test "$env:GITHUB_WORKSPACE\waters-build\source validation with spaces"
          if ($LASTEXITCODE -ne 0) { throw 'Source real-acquisition validation failed' }
      - name: Exercise source application with complete real acquisitions on Linux
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s '-screen 0 1920x1200x24' wineboot -u
          xvfb-run -a -s '-screen 0 1920x1200x24' python portable_waters_convert/build/launcher.py --smoke-test "$GITHUB_WORKSPACE/waters-build/source validation with spaces"
      - name: Build the native application with complete RAW demos
        run: python portable_waters_convert/build/build_native.py --output-dir waters-build
      - name: Exercise frozen Windows application from a path containing spaces
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'waters-build\dist\WatersConsole'
          $spaced = Join-Path $env:GITHUB_WORKSPACE 'waters-build\dist\WatersConsole with spaces'
          $validation = Join-Path $env:GITHUB_WORKSPACE 'waters-build\native validation with spaces'
          Move-Item -LiteralPath $bundle -Destination $spaced
          try {
            $start = [System.Diagnostics.ProcessStartInfo]::new()
            $start.FileName = Join-Path $spaced 'WatersConsole.exe'
            $start.UseShellExecute = $false
            $start.ArgumentList.Add('--smoke-test')
            $start.ArgumentList.Add($validation)
            $process = [System.Diagnostics.Process]::Start($start)
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Frozen real-acquisition validation failed: $($process.ExitCode)" }
          } finally {
            Move-Item -LiteralPath $spaced -Destination $bundle
          }
      - name: Exercise frozen Linux application from a path containing spaces
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          mv waters-build/dist/WatersConsole 'waters-build/dist/WatersConsole with spaces'
          trap 'mv "waters-build/dist/WatersConsole with spaces" waters-build/dist/WatersConsole' EXIT
          xvfb-run -a -s '-screen 0 1920x1200x24' 'waters-build/dist/WatersConsole with spaces/WatersConsole' --smoke-test "$GITHUB_WORKSPACE/waters-build/native validation with spaces"
      - name: Archive the verified Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path waters-build\dist\WatersConsole -DestinationPath waters-build\WatersConsole-win64.zip
          $hash = (Get-FileHash waters-build\WatersConsole-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WatersConsole-win64.zip" | Set-Content -Encoding ascii waters-build\SHA256-win64.txt
      - name: Archive the verified Linux folder, preserving executable permissions
        if: runner.os == 'Linux'
        run: |
          tar -czf waters-build/WatersConsole-linux-x64.tar.gz -C waters-build/dist WatersConsole
          cd waters-build
          sha256sum WatersConsole-linux-x64.tar.gz > SHA256-linux-x64.txt
      - name: Upload verified application archive
        uses: actions/upload-artifact@v4
        with:
          name: WatersConsole-${{ matrix.platform }}
          path: |
            waters-build/WatersConsole-${{ matrix.platform }}.zip
            waters-build/WatersConsole-${{ matrix.platform }}.tar.gz
            waters-build/SHA256-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload acquisition validation and exact build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WatersConsole-${{ matrix.platform }}-validation
          path: |
            waters-build/build_provenance.json
            waters-build/source validation with spaces/
            waters-build/native validation with spaces/
          if-no-files-found: ignore
          retention-days: 30
