[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deconvovo"
version = "0.3.0"
description = "Waters Instrument Console with offline interactive IM-MS viewing"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "plotly",
    "matplotlib",
]

[project.optional-dependencies]
deconv = ["unidec"]
gui = ["PySide6"]
all = ["unidec", "PySide6"]

[project.scripts]
deconvovo = "deconvovo.cli:main"
deconvovo-gui = "gui.app:main"

[tool.setuptools]
packages = ["deconvovo", "deconvovo.vendors", "gui", "gui.widgets", "gui.panels"]
